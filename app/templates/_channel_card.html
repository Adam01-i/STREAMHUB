<a href="/channel/{{ channel.id }}"
   class="group block bg-ink-800 border border-ink-700 rounded-xl overflow-hidden
          hover:border-brand-500 transition">
    <div class="aspect-video bg-ink-700 flex items-center justify-center">
        {% if channel.logo_url %}
        <img src="{{ channel.logo_url }}" alt="{{ channel.name }}" class="max-h-16 max-w-[80%] object-contain">
        {% else %}
        <span class="text-2xl font-bold text-gray-600">{{ channel.name[:2]|upper }}</span>
        {% endif %}
    </div>
    <div class="p-3">
        <p class="font-medium text-sm text-white truncate group-hover:text-brand-500 transition">
            {{ channel.name }}
        </p>
        <p class="text-xs text-gray-500 mt-1">
            {% if channel.country %}{{ channel.country.flag }} {{ channel.country.name }}{% endif %}
        </p>
    </div>
</a>
